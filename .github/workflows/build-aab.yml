name: Build Transiva Driver Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/transiva-release.jks
          test -s app/transiva-release.jks

      - name: Build signed release APK and AAB
        run: gradle clean assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: transiva-driver-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Driver AAB
        uses: actions/upload-artifact@v4
        with:
          name: transiva-driver-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
