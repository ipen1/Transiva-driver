name: Build Transiva Driver Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Play Store source policy gate
        run: |
          chmod +x gradlew tools/playstore_release_gate.py
          ./gradlew --transiva-wrapper-check
          python3 tools/playstore_release_gate.py

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/transiva-release.jks
          test -s app/transiva-release.jks

      - name: Unit tests and release lint
        run: ./gradlew clean testDebugUnitTest lintRelease

      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Validate final merged manifest and AAB
        run: |
          python3 tools/playstore_release_gate.py
          unzip -t app/build/outputs/bundle/release/*.aab >/dev/null
          test -s app/build/outputs/bundle/release/*.aab

      - name: Upload Driver APK
        uses: actions/upload-artifact@v6
        with:
          name: transiva-driver-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Driver AAB
        uses: actions/upload-artifact@v6
        with:
          name: transiva-driver-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
