name: Build Transiva Driver Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Clean stale instrumentation harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/androidTest/java/com/transiva/app/TestHarnessActivity.java
          test ! -e app/src/androidTest/java/com/transiva/app/TestHarnessActivity.java
          test -s app/src/debug/java/com/transiva/app/TestHarnessActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The previous repository contained a non-official/custom wrapper JAR.
      # setup-gradle validates every committed wrapper JAR before Gradle runs,
      # therefore remove it first and regenerate an official wrapper below.
      - name: Remove legacy Gradle Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -f gradle/wrapper/gradle-wrapper.jar
          test ! -e gradle/wrapper/gradle-wrapper.jar

      - name: Setup official Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Generate and verify official Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          OFFICIAL_WRAPPER_SHA256="2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046"
          DIST_SHA256="f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"

          gradle wrapper --gradle-version 8.11.1 --distribution-type bin

          test -s gradle/wrapper/gradle-wrapper.jar
          echo "${OFFICIAL_WRAPPER_SHA256}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

          # Pin the Gradle distribution itself as well.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle/wrapper/gradle-wrapper.properties')
          text = p.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if not line.startswith('distributionSha256Sum=')]
          lines.append('distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -F "distributionSha256Sum=${DIST_SHA256}" gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Verify session callback regression
        run: python3 tools/reliability/driver_session_regression.py

      - name: Verify chat notification replay regression
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/transiva-notice-json.jar"
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $RUNNER_TEMP/transiva-notice-json.jar" | sha256sum --check --strict
          JSON_JAR="$RUNNER_TEMP/transiva-notice-json.jar" python3 tools/reliability/chat_notification_client_regression.py
          JSON_JAR="$RUNNER_TEMP/transiva-notice-json.jar" python3 tools/reliability/lifecycle_navigation_regression.py
          python3 tools/reliability/window_insets_regression.py
          JSON_JAR="$RUNNER_TEMP/transiva-notice-json.jar" python3 tools/reliability/navigation_recovery_regression.py

      - name: Verify Play Store source policy gate
        run: |
          chmod +x tools/playstore_release_gate.py
          python3 tools/playstore_release_gate_test.py
          python3 tools/playstore_release_gate.py
          python3 tools/play_compat_gate.py

      - name: Verify Stability 4.0 architecture gate
        run: |
          chmod +x tools/stability4_gate.py
          python3 tools/stability4_gate.py
          python3 tools/prelaunch_invariant_check.py

      - name: Verify Stability 4.3 rich notification and instrumentation gate
        run: |
          chmod +x tools/stability43_gate.py
          python3 tools/stability43_gate.py

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/transiva-release.jks
          test -s app/transiva-release.jks

      - name: Unit tests, instrumentation compile and release lint
        run: ./gradlew clean testDebugUnitTest assembleDebugAndroidTest lintRelease

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: transiva-driver-lint-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn

      - name: Build signed release APK and AAB
        run: |
          python3 tools/call_upgrade_regression.py
          ./gradlew assembleRelease bundleRelease
          python3 tools/verify_webrtc_jni.py app/build/outputs/mapping/release/mapping.txt
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Validate final merged manifest and AAB
        run: |
          python3 tools/playstore_release_gate.py
          python3 tools/play_compat_gate.py --artifacts
          shopt -s nullglob
          aabs=(app/build/outputs/bundle/release/*.aab)
          if [ ${#aabs[@]} -eq 0 ]; then
            echo "Release AAB not found"
            exit 1
          fi
          for aab in "${aabs[@]}"; do
            unzip -t "$aab" >/dev/null
            test -s "$aab"
          done

      - name: Upload Driver APK
        uses: actions/upload-artifact@v6
        with:
          name: transiva-driver-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Driver AAB
        uses: actions/upload-artifact@v6
        with:
          name: transiva-driver-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transiva-driver-r8-reports
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn


  instrumentation:
    name: Android runtime API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 26, 29, 31, 34, 35, 36]
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Clean stale instrumentation harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/androidTest/java/com/transiva/app/TestHarnessActivity.java
          test ! -e app/src/androidTest/java/com/transiva/app/TestHarnessActivity.java
          test -s app/src/debug/java/com/transiva/app/TestHarnessActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # setup-gradle validates committed wrapper JARs before Gradle runs.
      # Remove the legacy/custom JAR first, exactly like the release build job.
      - name: Remove legacy Gradle Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -f gradle/wrapper/gradle-wrapper.jar
          test ! -e gradle/wrapper/gradle-wrapper.jar

      - name: Setup official Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Generate official wrapper
        shell: bash
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
      - name: Compile runtime APKs before starting emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PtransivaCiRuntimeAbi=x86_64 --console=plain
      - name: Verify runtime CI failure handling
        run: python3 tools/ci/android_runtime_result_test.py
      - name: Verify emulator SDK recovery
        run: python3 tools/ci/prepare_emulator_sdk_test.py
      - name: Install emulator host dependency before SDK verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
          python3 -c 'import ctypes; ctypes.CDLL("libpulse.so.0")'
      - name: Prepare verified emulator SDK with bounded recovery
        run: python3 tools/ci/prepare_emulator_sdk.py
      - name: Run connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, verified installer contract
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 3072
          script: bash tools/ci/run_android_runtime_tests.sh
      - name: Print instrumentation failure details
        if: failure()
        shell: bash
        run: |
          echo "=== Test XML failure details ==="
          find app/build/outputs/androidTest-results/connected -name '*.xml' -type f -print -exec grep -n -E '<failure|<error|testsuite|Caused by:' {} \; 2>/dev/null || true
          echo "=== Instrumentation reports ==="
          find app/build/reports/androidTests/connected -type f 2>/dev/null | head -40 || true

      - name: Upload instrumentation reports and emulator logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-api-${{ matrix.api-level }}
          path: |
            artifacts/android-runtime/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
