name: Transiva Driver Burst Test

on:
  workflow_dispatch:
    inputs:
      load_level:
        description: "Concurrent users"
        required: true
        default: "10"
        type: choice
        options: ["10","25","50","100","200"]
      high_load_confirmation:
        description: "Untuk 100/200 ketik: SAYA PAHAM"
        required: false
        default: ""

permissions:
  contents: read
concurrency:
  group: transiva-driver-production-burst
  cancel-in-progress: false

jobs:
  stress-test:
    name: "Driver Burst ${{ inputs.load_level }} concurrent"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate load-test account
        env:
          USERS: ${{ inputs.load_level }}
          CONFIRM: ${{ inputs.high_load_confirmation }}
          USERNAME: ${{ secrets.TRANSIVA_DRIVER_TEST_USERNAME }}
          PASSWORD: ${{ secrets.TRANSIVA_DRIVER_TEST_PASSWORD }}
          DEVICE: ${{ secrets.TRANSIVA_DRIVER_TEST_DEVICE_UUID }}
        run: |
          set -euo pipefail
          [ -n "$USERNAME" ] || { echo "::error::Buat secret TRANSIVA_DRIVER_TEST_USERNAME"; exit 1; }
          [ -n "$PASSWORD" ] || { echo "::error::Buat secret TRANSIVA_DRIVER_TEST_PASSWORD"; exit 1; }
          [ -n "$DEVICE" ] || { echo "::error::Buat secret TRANSIVA_DRIVER_TEST_DEVICE_UUID"; exit 1; }
          if { [ "$USERS" = "100" ] || [ "$USERS" = "200" ]; } && [ "$CONFIRM" != "SAYA PAHAM" ]; then
            echo "::error::Ketik SAYA PAHAM untuk 100/200"; exit 1
          fi

      - id: config
        env: { USERS: "${{ inputs.load_level }}" }
        run: |
          case "$USERS" in 10) N=100;; 25|50|100|200) N=200;; *) exit 1;; esac
          echo "requests=$N" >> "$GITHUB_OUTPUT"

      - id: test
        continue-on-error: true
        env:
          USERNAME: ${{ secrets.TRANSIVA_DRIVER_TEST_USERNAME }}
          PASSWORD: ${{ secrets.TRANSIVA_DRIVER_TEST_PASSWORD }}
          DEVICE: ${{ secrets.TRANSIVA_DRIVER_TEST_DEVICE_UUID }}
          USERS: ${{ inputs.load_level }}
          REQUESTS: ${{ steps.config.outputs.requests }}
        run: |
          set +e
          python3 tools/driver_load_test_ci.py \
            --base "https://transiva.my.id/server/" \
            --username "$USERNAME" \
            --password "$PASSWORD" \
            --device "$DEVICE" \
            --users "$USERS" \
            --requests "$REQUESTS"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - if: always()
        run: cat driver-stress-summary.md >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-burst-${{ inputs.load_level }}
          path: |
            driver-stress-result.json
            driver-stress-summary.md
          retention-days: 14

      - if: always()
        env: { EXIT: "${{ steps.test.outputs.exit_code }}" }
        run: '[ "${EXIT:-1}" = "0" ] || exit 1'
