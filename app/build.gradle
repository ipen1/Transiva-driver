plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def transivaEnableR8 = project.hasProperty("transivaEnableR8") && project.property("transivaEnableR8").toString().toBoolean()

android {
    namespace 'com.transiva.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.transiva.driver'
        minSdk 23
        targetSdk 36
        versionCode 11
        versionName '2.8.11'
    }

    signingConfigs {
        release {
            storeFile file("transiva-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            debuggable false

            // Deliberately kept OFF for the launch candidate. Enabling R8 immediately
            // before production can introduce reflection/library regressions. The
            // ProGuard files are declared now so hardening can be enabled after the
            // regression suite passes without changing the release contract.
            // Default OFF untuk launching. Aktifkan hanya setelah regression test:
            // ./gradlew assembleRelease -PtransivaEnableR8=true
            minifyEnabled transivaEnableR8
            shrinkResources transivaEnableR8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    // Native audio WebRTC (Maven Central)
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'

    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Native GPU map renderer. No WebView / Leaflet / JavaScript bridge.
    implementation 'org.maplibre.gl:android-sdk:13.1.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
}
