plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.transiva.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.transiva.merchant'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '1.8-wave17'
    }

    signingConfigs {
        release {
            storeFile file("transiva-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            debuggable false
            // Keep R8 off for the 17 Aug pilot until a signed release regression pass is complete.
            // Rules are prepared in proguard-rules.pro so hardening can be enabled safely afterward.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.activity:activity:1.9.3'

    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // P1: lifecycle-aware image loading + memory/disk cache.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Native GPU map renderer. No WebView / Leaflet / JavaScript bridge.
    implementation 'org.maplibre.gl:android-sdk:13.1.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
